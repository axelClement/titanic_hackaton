# Configuration file for Titanic ML project

[paths]
train_data = data/train.csv
test_data = data/test.csv
models_dir = models
submissions_dir = submissions

[preprocessing]
age_strategy = median
fare_strategy = median
embarked_strategy = mode
drop_cabin = true

[features]
create_title = true
create_family_size = true
create_is_alone = true
create_age_groups = true
create_fare_groups = true

[random_forest]
n_estimators = 200
max_depth = 10
min_samples_split = 5
min_samples_leaf = 2
random_state = 42

[gradient_boosting]
n_estimators = 200
learning_rate = 0.1
max_depth = 5
random_state = 42

[ensemble]
voting = soft
weights = 2,2,1,1

[cross_validation]
n_folds = 5
scoring = accuracy
